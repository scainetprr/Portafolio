<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>PlayerCards · scainetprr</title>
<link rel="icon" type="image/png" href="Imagenes/favicon.png">
<style>
:root{--bg:#0a0e1a;--card:#131a30;--line:#26304d;--red:#e11d2e;--blue:#2b7fff;--w:#eef1f8;--mut:#8b94ad}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--w);font-family:Segoe UI,system-ui,Arial,sans-serif;padding:26px 18px;line-height:1.6}
.wrap{max-width:860px;margin:auto}
a{color:var(--blue)}
.back{font-size:14px}
h1{font-size:32px;margin:12px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h3{margin-bottom:12px}
label{color:var(--mut);font-size:12px;display:block;margin:10px 0 5px}
input[type=text]{width:100%;padding:11px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-size:14px;outline:none;box-sizing:border-box}
.btn{padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#1c2440;color:#fff;margin-top:12px}
.btn.p{background:var(--red);border-color:var(--red)}
.mcprev{background:#0a0e1c;border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;margin-top:12px;min-height:220px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.mcprev img{image-rendering:pixelated;background:transparent}
.dcard{width:100%;max-width:340px;background:#111214;border-radius:12px;overflow:hidden;text-align:left}
.dbanner{height:90px;background:linear-gradient(135deg,#e11d2e,#2b7fff)}
.dbody{padding:0 14px 14px}
.dav{width:76px;height:76px;border-radius:50%;margin-top:-38px;border:6px solid #111214;background:#1c2440;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.dbox{background:#1e1f22;border-radius:8px;padding:12px;margin-top:8px}
.dbox b{font-size:16px}
.dtag{color:#b5bac1;font-size:12px}
.drole{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;margin:6px 4px 0 0;font-weight:700}
.dabout{font-size:12px;color:#dbdee1;margin-top:8px}
.mut{color:var(--mut);font-size:13px}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
body{background:radial-gradient(900px 400px at 15% 0%,#2b7fff22,transparent 60%),radial-gradient(900px 400px at 85% 0%,#e11d2e22,transparent 60%),var(--bg)}.card{transition:transform .3s,box-shadow .3s,border-color .3s}.card:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:0 10px 30px #e11d2e33}h1{text-shadow:0 0 30px #e11d2e44}.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s ease}.rv.vis{opacity:1;transform:none}#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.wrap{position:relative;z-index:1}.orb{position:fixed;border-radius:50%;filter:blur(110px);z-index:0;opacity:.32;pointer-events:none}.o1{width:480px;height:480px;background:#e11d2e;top:-160px;right:-120px;animation:drift 14s ease-in-out infinite alternate}.o2{width:420px;height:420px;background:#2b7fff;bottom:-160px;left:-120px;animation:drift 18s ease-in-out infinite alternate-reverse}@keyframes drift{to{transform:translate(-70px,60px) scale(1.15)}}</style>
</head>
<body><canvas id="stars"></canvas><div class="orb o1"></div><div class="orb o2"></div>
<script>(function(){var cv=document.getElementById('stars');if(!cv)return;var cx=cv.getContext('2d'),P=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);for(var i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,s:Math.random()*.4+.12,c:['#ffffff','#e11d2e','#2b7fff'][i%3]});(function anim(){cx.clearRect(0,0,cv.width,cv.height);for(var k=0;k<P.length;k++){var p=P[k];p.y-=p.s;if(p.y<0){p.y=cv.height;p.x=Math.random()*cv.width}cx.globalAlpha=.65;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(anim)})();})();

<div class="wrap">
<a class="back" href="index.html">← Volver al portafolio</a>
<h1>PlayerCards</h1>
<p class="sub">Tu skin de Minecraft y tu tarjeta estilo Discord, generadas al instante.</p>
<div class="grid">
<div class="card"><h3>Skin Minecraft</h3>
<label>Nick de Minecraft</label><input type="text" id="mc" placeholder="Ej: scainetprr" value="scainetprr">
<button class="btn p" onclick="drawMC()">Generar</button>
<div class="mcprev" id="mcOut"><span class="mut">Pulsa Generar</span></div>
<p class="mut" style="margin-top:8px">Renders vía minotar.net (cabeza + cuerpo).</p>
</div>
<div class="card"><h3>Tarjeta Discord</h3>
<label>Nombre a mostrar</label><input type="text" id="dName" value="scainetprr" oninput="drawD()">
<label>Usuario (tag)</label><input type="text" id="dTag" value="scainetprrmn" oninput="drawD()">
<label>Rol destacado (texto)</label><input type="text" id="dRole" value="Jr-Admin · Skylith" oninput="drawD()">
<label>Color del rol (hex)</label><input type="text" id="dColor" value="#e11d2e" oninput="drawD()">
<label>Sobre mí</label><input type="text" id="dAbout" value="Staff & Configurador Minecraft" oninput="drawD()">
<div class="mcprev"><div class="dcard"><div class="dbanner" id="dBanner"></div><div class="dbody"><div class="dav" id="dAv">S</div><div class="dbox"><b id="dNameV">scainetprr</b><div class="dtag" id="dTagV">scainetprrmn</div><div><span class="drole" id="dRoleV">Jr-Admin · Skylith</span></div><div class="dabout" id="dAboutV">Staff &amp; Configurador Minecraft</div></div></div></div></div>
</div>
</div>
<footer>scainetprr · PlayerCards</footer>
</div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML}
function drawMC(){var u=document.getElementById('mc').value.trim()||'scainetprr';var box=document.getElementById('mcOut');box.innerHTML='<div><img src="https://minotar.net/helm/'+encodeURIComponent(u)+'/100.png" alt="head" width="100" height="100" onerror="this.outerHTML='<span class=mut>Nick no encontrado</span>'"><p class="mut">Cabeza</p></div><div><img src="https://minotar.net/body/'+encodeURIComponent(u)+'/100.png" alt="body" onerror="this.remove()"><p class="mut">Cuerpo</p></div>'}
function drawD(){var n=document.getElementById('dName').value||'Usuario';var t=document.getElementById('dTag').value||'';var r=document.getElementById('dRole').value||'';var c=document.getElementById('dColor').value||'#e11d2e';var a=document.getElementById('dAbout').value||'';document.getElementById('dNameV').textContent=n;document.getElementById('dTagV').textContent=t;document.getElementById('dAv').textContent=n.charAt(0).toUpperCase();var rv=document.getElementById('dRoleV');rv.textContent=r;rv.style.background=c+'33';rv.style.color=c;rv.style.display=r?'':'none';document.getElementById('dAboutV').textContent=a;document.getElementById('dBanner').style.background='linear-gradient(135deg,'+c+',#2b7fff)'}
drawMC();drawD();
</script>
<script>(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}})},{threshold:.1});var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++){cs[i].classList.add('rv');cs[i].style.transitionDelay=(i%3)*.07+'s';io.observe(cs[i])}})();
</script></body>
</html>
