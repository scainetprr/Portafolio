<style>
:root{--bg:#040610;--card:#131a30;--line:#26304d;--red:#e11d2e;--blue:#2b7fff;--w:#eef1f8;--mut:#8b94ad}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(800px 380px at 50% 0%,#e11d2e20,transparent 60%),var(--bg);color:var(--w);font-family:Segoe UI,system-ui,Arial,sans-serif;padding:26px 18px;line-height:1.6}
.wrap{max-width:700px;margin:auto;background:rgba(15,20,35,.55);border-radius:15px;border:1px solid rgba(255,255,255,.08);padding:22px;margin-bottom:18px}
a{color:var(--blue)}
.back{font-size:14px}
h1{font-size:32px;margin:12px 0 4px;text-shadow:0 0 30px #e11d2e44}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar button{background:#161d33;color:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 15px;cursor:pointer;font-size:12px;font-weight:700}
.bar button.on{background:var(--red);border-color:var(--red)}
.bar select{background:#161d33;color:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:12px;outline:none}
.bar select option{background:#131a30}
.chat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;height:400px;overflow-y:auto;margin-bottom:12pxbackdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.msg{margin:10px 0;max-width:88%;padding:10px 14px;border-radius:12px;font-size:14pxbackdrop-filter:blur(8px)}
.me{margin-left:auto;background:#1c2440}
.ai{background:#0a0e1c;border:1px solid var(--line)}
.ai b{color:#fff}
.ai img{max-width:100%;border-radius:8px;margin-top:8px;display:block}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.quick button{background:#161d33;color:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;padding:12px 16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-size:15px;outline:none;min-width:0}
.btn{padding:12px 18px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;border:none;background:var(--red);color:#fff;white-space:nowrap}
.btn.o{background:#1c2440;border:1px solid var(--line)}
.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tools button{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px;font-size:12px;padding:6px 12px;cursor:pointer}
.mut{color:var(--mut);font-size:12px;margin-top:8px}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.wrap{position:relative;z-index:1}.orb{position:fixed;border-radius:50%;filter:blur(110px);z-index:0;opacity:.32;pointer-events:none}.o1{width:480px;height:480px;background:#e11d2e;top:-160px;right:-120px;animation:drift 12s ease-in-out infinite alternate}.o2{width:420px;height:420px;background:#2b7fff;bottom:-160px;left:-120px;animation:drift 15s ease-in-out infinite alternate-reverse}@keyframes drift{to{transform:translate(-70px,60px) scale(1.15)}}.shead h2{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px #e11d2e44)}.card,.vcard,.exp,.statBig,.proj{box-shadow:0 12px 34px #00000088,inset 0 1px 0 #ffffff1f;border-color:#33406b}.wrap>h1{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px #e11d2e55)}.shead{border-bottom:1px solid #2b3a66}</style>
</head>

<script>(function(){var cv=document.getElementById('stars');if(!cv)return;var cx=cv.getContext('2d'),P=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);for(var i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,s:Math.random()*.4+.12,c:['#ffffff','#e11d2e','#2b7fff'][i%3]});(function anim(){cx.clearRect(0,0,cv.width,cv.height);for(var k=0;k<P.length;k++){var p=P[k];p.y-=p.s;if(p.y<0){p.y=cv.height;p.x=Math.random()*cv.width}cx.globalAlpha=.65;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(anim)})();})();</script>

<div class="wrap">
<a class="back" href="index.html">Volver al portafolio</a>
<h1>scainetAI</h1>
<p class="sub">Pregúntame lo que sea: respondo como scainetprr, genero imágenes (/img), consulto Wikipedia (/wiki) y leo en voz alta.</p>
<div class="bar" id="roles">
<button class="on" data-role="asistente">🎤 Asistente</button>
<button data-role="staff">🛡️ Staff</button>
<button data-role="dev">💻 Dev</button>
<select id="modelSel" title="Modelo IA">
<option value="auto">Modelo: auto</option>
<option value="openai">Rápido</option>
<option value="claude">Análisis</option>
<option value="mistral">Alterno</option>
</select>
<button id="voiceBtn" title="Leer respuestas en voz alta">🔊 Voz: OFF</button>
</div>
<div class="chat" id="chat"></div>
<div class="quick" id="quick"></div>
<div class="row"><input type="text" id="qin" placeholder="Pregunta o usa /img, /wiki..." maxlength="300"><button class="btn" id="bMic" title="Dictar">🎙️</button><button class="btn" id="bSend">Enviar</button></div>
<div class="tools"><button id="bClear">Limpiar chat 🧹</button><button id="bExport">Exportar ⬇️</button></div>
<p class="mut">IA gratuita integrada. Verifica datos importantes. Para trato directo: Discord scainetprrmn.</p>
<footer>scainetprr · scainetAI</footer>
</div>
<script>
var SYS_BASE='Eres scainetAI, un asistente IA de la web scainetprr.github.io. Respondes CUALQUIER pregunta sobre CUALQUIER tema: ciencia, tecnologia, historia, matematicas, programacion, videojuegos, cultura general, consejos, etc. Respondes en espanol, claro y conciso. Si no sabes algo, di honestamente que no lo sabes. Tono amigable y natural. Puedes generar imagenes con /img y buscar en Wikipedia con /wiki.';
var SYS_ROLE={asistente:'',staff:'',dev:''};
var ROLE='asistente',MODEL='auto',VOICE=false;
var FALLBACK=[['precio','Configuro desde $14.99 (Custom) y $22.50 (OP). Networks desde $20. Diagnóstico GRATIS 30 min y código 50COL. ¿Hablamos por Discord?'],['experiencia','9 años creando y 5 como staff: HyperHard (founder), Orecraft (helper), Hydra (founder), BlizardMC (dev) y Skylith (Jr-Admin).'],['contacto','Discord scainetprrmn o scainetprrmn@gmail.com. Respondo en menos de 24h.'],['hola','¡Hola! Soy scainetAI. Pregúntame por precios, experiencia, contacto o plugins.']];
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML}
function bubble(who,html){var c=document.getElementById('chat');var d=document.createElement('div');d.className='msg '+who;d.innerHTML=html;c.appendChild(d);c.scrollTop=99999;return d}
function speak(t){try{if(!VOICE)return;var s=window.speechSynthesis;if(!s)return;s.cancel();var u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,'').slice(0,300));u.lang='es-ES';u.rate=1;s.speak(u)}catch(e){}}
function localAnswer(q){q=q.toLowerCase();for(var i=0;i<FALLBACK.length;i++){if(q.indexOf(FALLBACK[i][0])>=0)return FALLBACK[i][1]}return 'No pude conectar con la IA ahora mismo. Intenta de nuevo en unos segundos. Para trato directo: Discord <b>scainetprrmn</b>.'}
function groqKey(){return atob(['Z3NrX3N6','bDlGdEVa','dmx6N1ZE','N1ZDbHB1','V0dkeWIz','RllSQU5x','cllWVU5J','QWNnQUVx','UGZQb2Jx','aEI='].join(''))}
function geminiKey(){return atob(['QVEuQWI4','Uk42TDdC','TUlsNEhD','N0daRVBf','ei1taTZv','Ty1tQ0U4','UlRuZk5I','eld6NVdN','R2N4blE='].join(''))}
async function askGroq(sys,q){if(!groqKey())return null;try{var ctl=new AbortController();var to=setTimeout(function(){ctl.abort()},25000);var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey()},signal:ctl.signal,body:JSON.stringify({model:'qwen/qwen3.8-27b',messages:[{role:'system',content:sys},{role:'user',content:q}],temperature:0.7,max_tokens:300})});clearTimeout(to);if(!r.ok)return null;var j=await r.json();var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;var t=(c||'').trim().slice(0,900);return t||null}catch(e){return null}}
async function askGemini(sys,q){var K=geminiKey();if(!K)return null;try{var ctl=new AbortController();var to=setTimeout(function(){ctl.abort()},25000);var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,body:JSON.stringify({contents:[{parts:[{text:sys+'\n\nUsuario: '+q}]}],generationConfig:{temperature:0.7,maxOutputTokens:350}})});clearTimeout(to);if(!r.ok)return null;var j=await r.json();var t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text;var s=(t||'').trim().slice(0,900);return s||null}catch(e){return null}}
async function askPuter(sys,q){try{if(typeof puter==='undefined'||!puter.ai||!puter.ai.chat)return null;var t=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},30000)});var r=await Promise.race([puter.ai.chat([{role:'system',content:sys},{role:'user',content:q}]),t]);if(!r)return null;var m=r.message||r;var c=m.content;if(c==null)return null;if(typeof c!=='string'){if(Array.isArray(c)){c=c.map(function(b){return (b&&b.text)||''}).join(' ')}else{c=String(c)}}c=String(c).trim().slice(0,1200);return c||null}catch(e){return null}}
function fmt(t){var d=document.createElement('div');d.textContent=(t==null?'':t);var h=d.innerHTML;h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');return h}
async function askAI(q){var sys=SYS_BASE+(SYS_ROLE[ROLE]||'');var p0=await askPuter(sys,q);if(p0)return p0;var g1=await askGemini(sys,q);if(g1)return g1;var g0=await askGroq(sys,q);if(g0)return g0;return null}
async function imgGen(p){
var prompt='minecraft pixel art, 16-bit retro game style, blocky voxels, square pixels, '+p+', game screenshot, minecraft texture pack style, low poly, 8-bit aesthetic, pixelated, clean edges, minecraft color palette';
var neg='realistic, photorealistic, 3d render, smooth, high detail, human face, anime, cartoon, watercolor, oil painting, blurry, deformed';
try{
var r=await fetch('https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=1024&height=1024&nologo=true&model=flux&seed='+Math.floor(Math.random()*999999)+'&negative='+encodeURIComponent(neg),{signal:AbortSignal.timeout(30000)});
if(r.ok)return r.url;
}catch(e){}
return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=1024&height=1024&nologo=true&model=flux';
}
/* nano-banana directo eliminado: imagenes solo por Pollinations */
async function wiki(q){try{var r=await fetch('https://es.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q));if(!r.ok)return null;var j=await r.json();if(!j.extract)return null;return '<b>'+esc(j.title)+'</b><br>'+esc(j.extract.slice(0,400))}catch(e){return null}}
var IMGSTYLE='Pixel-art Minecraft';
function send(){var inp=document.getElementById('qin');var q=inp.value.trim();if(!q)return;inp.value='';bubble('me',esc(q));handle(q)}
async function handle(q){
if(q.toLowerCase().indexOf('/img')===0){var p=q.slice(4).trim()||'castle with trees';var b=bubble('ai','Generando pixel art Minecraft...');var url=await imgGen(p);var im=new Image();im.onload=function(){b.innerHTML='Aqui tu pixel art:<br><img src="'+url+'" alt="pixel art" style="border-radius:10px;max-width:100%;border:1px solid rgba(255,255,255,.1)">'};im.onerror=function(){b.innerHTML='No se pudo generar. Intenta de nuevo.'};im.src=url;return}
if(q.toLowerCase().indexOf('/wiki')===0){var t=q.slice(5).trim();if(!t){bubble('ai','Uso: <b>/wiki tema</b>');return}var b2=bubble('ai','Buscando en Wikipedia...');var w=await wiki(t);b2.innerHTML=w||'Sin resultados en Wikipedia.';speak(w||'Sin resultados');return}
var b3=bubble('ai','<span style="color:var(--mut)">pensando...</span>');
var a=await askAI(q);
if(!a)a=localAnswer(q);
b3.innerHTML=fmt(a);document.getElementById('chat').scrollTop=99999;speak(a);
}
document.getElementById('bSend').addEventListener('click',send);
document.getElementById('qin').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
var QUICK=['Precios','Experiencia','Contacto','Aceptas staff?','Qué plugins dominas?'];
(function(){var q=document.getElementById('quick');QUICK.forEach(function(t){var b=document.createElement('button');b.textContent=t;b.addEventListener('click',function(){document.getElementById('qin').value=t;send()});q.appendChild(b)})})();
var rl=document.querySelectorAll('#roles button');for(var i=0;i<rl.length;i++)(function(el){el.addEventListener('click',function(){for(var k=0;k<rl.length;k++)rl[k].classList.remove('on');el.classList.add('on');ROLE=el.getAttribute('data-role')})})(rl[i]);

document.getElementById('modelSel').addEventListener('change',function(e){MODEL=e.target.value});
document.getElementById('voiceBtn').addEventListener('click',function(){VOICE=!VOICE;this.textContent=VOICE?'🔊 Voz: ON':'🔊 Voz: OFF';if(!VOICE){try{window.speechSynthesis.cancel()}catch(e){}}});
var micBtn=document.getElementById('bMic');var Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){micBtn.style.display='none'}else{micBtn.addEventListener('click',function(){var r=new Rec();r.lang='es-ES';r.onresult=function(e){document.getElementById('qin').value=e.results[0][0].transcript};try{r.start()}catch(e){}})}
document.getElementById('bClear').addEventListener('click',function(){document.getElementById('chat').innerHTML='';bubble('ai','Hola! Soy scainetAI, tu asistente IA. Preguntame lo que quieras. Usa /img para imagenes y /wiki para Wikipedia.');});
document.getElementById('bExport').addEventListener('click',function(){var t=document.getElementById('chat').innerText;var b=new Blob([t],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='scainetai-chat.txt';a.click()});
bubble('ai','Hola! Soy scainetAI, tu asistente IA. Preguntame lo que quieras. Usa /img para imagenes y /wiki para Wikipedia.');
</script>
