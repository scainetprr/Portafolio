<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Radio Gamer · scainetprr</title>
<link rel="icon" type="image/png" href="Imagenes/favicon.png">
<style>
body{background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.03),transparent 55%),var(--bg);color:var(--w);font-family:Segoe UI,system-ui,Arial,sans-serif;padding:26px 18px;line-height:1.6;overflow-x:hidden}
:root{--bg:#0a0e1a;--card:#131a30;--line:#26304d;--red:#e11d2e;--blue:#2b7fff;--w:#eef1f8;--mut:#8b94ad}
*{box-sizing:border-box;margin:0;padding:0}

.wrap{max-width:680px;margin:auto}
a{color:var(--blue)}
.back{font-size:14px}
h1{font-size:32px;margin:12px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px;text-align:centerbackdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:#161d33;color:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 18px;cursor:pointer;font-size:13px;font-weight:700}
.tabs button.on{background:var(--red);border-color:var(--red)}
#viz{width:100%;height:110px;background:#0a0e1c;border-radius:10px;display:block}
.track{font-size:18px;font-weight:800;margin:12px 0 2px}
.artist{color:var(--mut);font-size:13px}
.ctrl{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap;align-items:center}
.btn{padding:11px 22px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#1c2440;color:#fff}
.btn.p{background:var(--red);border-color:var(--red)}
.mood{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.mood button{background:#0a0e1c;color:#c0c8dc;border:1px solid var(--line);border-radius:99px;padding:8px 16px;cursor:pointer;font-size:13px}
.mood button.on{border-color:var(--red);color:#fff}
input[type=range]{width:150px;accent-color:var(--red)}
input[type=text]{width:100%;padding:11px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-size:14px;outline:none;box-sizing:border-box;margin-top:8px}
.pl{text-align:left;margin-top:10px}
.trk{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.trk:hover{background:#1c2440}
.trk.on{background:#1c2440;border:1px solid var(--red)}
#ytBox iframe{width:100%;height:220px;border:0;border-radius:10px;margin-top:10px}
.mut{color:var(--mut);font-size:13px}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
.card{transition:transform .3s,box-shadow .3s,border-color .3sbackdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.3)}.card:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:0 10px 30px #e11d2e33}h1{text-shadow:0 0 30px #e11d2e44}.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s ease}.rv.vis{opacity:1;transform:none}#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.wrap{position:relative;z-index:1}.orb{position:fixed;border-radius:50%;filter:blur(110px);z-index:0;opacity:.08;pointer-events:none}.o1{width:350px;height:350px;background:#e11d2e;top:-160px;right:-120px;animation:drift 14s ease-in-out infinite alternate}.o2{width:320px;height:320px;background:#2b7fff;bottom:-160px;left:-120px;animation:drift 18s ease-in-out infinite alternate-reverse}@keyframes drift{to{transform:translate(-70px,60px) scale(1.15)}}.shead h2{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px #e11d2e44)}.card,.vcard,.exp,.statBig,.proj{box-shadow:0 12px 34px #00000088,inset 0 1px 0 #ffffff1f;border-color:#33406b}.wrap>h1{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px #e11d2e55)}.shead{border-bottom:1px solid #2b3a66}</style>
</head>
<body><canvas id="stars"></canvas><div class="orb o1"></div><div class="orb o2"></div>
<script>(function(){var cv=document.getElementById('stars');if(!cv)return;var cx=cv.getContext('2d'),P=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);for(var i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,s:Math.random()*.4+.12,c:['#ffffff','#e11d2e','#2b7fff'][i%3]});(function anim(){cx.clearRect(0,0,cv.width,cv.height);for(var k=0;k<P.length;k++){var p=P[k];p.y-=p.s;if(p.y<0){p.y=cv.height;p.x=Math.random()*cv.width}cx.globalAlpha=.65;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(anim)})();})();</script>

<div class="wrap">
<a class="back" href="index.html">Volver al portafolio</a>
<h1>Radio Gamer</h1>
<p class="sub">Ambiente generado, tus MP3 y YouTube. Las canciones oficiales se eligen después.</p>
<div class="tabs"><button class="on" data-tab="gen">🎛 Generativo</button><button data-tab="mp3">🎵 MP3 / Archivos</button><button data-tab="yt">▶ YouTube</button></div>
<div class="card" id="tab-gen">
<canvas id="viz" width="600" height="110"></canvas>
<div class="track" id="tName">Lo-fi generativo</div>
<div class="artist" id="tArt">pulsa reproducir</div>
<div class="ctrl"><button class="btn p" id="bPlay">▶ Reproducir</button></div>
<div class="mood"><button class="on" data-mood="lofi">🌙 Lo-fi</button><button data-mood="epico">⚔️ Épico</button><button data-mood="chip">👾 Chiptune</button></div>
<div class="ctrl"><span class="mut">Vol</span><input type="range" id="vol" min="0" max="100" value="70"></div>
</div>
<div class="card" id="tab-mp3" style="display:none">
<div class="track" id="mName">Sin pista</div>
<div class="ctrl"><button class="btn" id="mPrev">|◀</button><button class="btn p" id="mPlay">▶ Reproducir</button><button class="btn" id="mNext">▶|</button></div>
<div class="pl" id="plist"></div>
<label class="mut">MP3 por URL directa (https://.../cancion.mp3):</label>
<input type="text" id="urlIn" placeholder="https://.../cancion.mp3">
<button class="btn" id="bAdd">Agregar a la lista</button>
<label class="mut" style="display:block;margin-top:10px">O archivo local:</label>
<input type="file" id="fileIn" accept="audio/*">
<p class="mut" style="margin-top:8px">Nota: YouTube no funciona como MP3 — usa la pestaña YouTube.</p>
</div>
<div class="card" id="tab-yt" style="display:none">
<label class="mut">Pega link de YouTube (video o lista):</label>
<input type="text" id="ytIn" placeholder="https://youtube.com/watch?v=...">
<button class="btn p" id="bYt">Reproducir en YouTube</button>
<div id="ytBox"></div>
</div>
<footer>scainetprr · Radio Gamer</footer>
</div>
<script>
var AC=null,AN=null,GAIN=null,GEN_ON=false,MOOD='lofi',GTIMERS=[];
var AUD=null,SRCN=null,PLAYLIST=[{n:'Ambiente IA · Lo-fi generativo',a:'generado en vivo',gen:true}],IDX=0,PLAYING=false;
function ctx(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;AC=new C();GAIN=AC.createGain();GAIN.gain.value=0.7;AN=AC.createAnalyser();AN.fftSize=64;GAIN.connect(AN);AN.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function stopAll(){GEN_ON=false;GTIMERS.forEach(clearTimeout);GTIMERS=[];if(AUD){AUD.pause();AUD=null}if(SRCN){try{SRCN.disconnect()}catch(e){}SRCN=null}}
var CHORDS=[[110,130.8,164.8,220],[98,123.5,146.8,196],[87.3,110,130.8,174.6],[130.8,164.8,196,246.9]];
var PENTA=[220,246.9,261.6,293.7,329.6,392,440,523.3];
function note(f,t,dur,type,vol){var ac=AC;var o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.1);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(GAIN);o.start(t);o.stop(t+dur+.1)}
function lofiStep(){if(!GEN_ON||MOOD!=='lofi')return;var t=AC.currentTime;var ch=CHORDS[Math.floor(Math.random()*CHORDS.length)];for(var i=0;i<ch.length;i++)note(ch[i],t,3.6,i<2?'sine':'triangle',0.06);GTIMERS.push(setTimeout(lofiStep,3200))}
function epicoStep(){if(!GEN_ON||MOOD!=='epico')return;var t=AC.currentTime;[55,55.4,110].forEach(function(f){note(f,t,4.5,'sawtooth',0.035)});note(65.4,t+1.2,1.2,'sine',0.16);note(49,t+2.4,1.4,'sine',0.14);GTIMERS.push(setTimeout(epicoStep,4200))}
var CHIP_I=0;
function chipStep(){if(!GEN_ON||MOOD!=='chip')return;var t=AC.currentTime;var f=PENTA[CHIP_I%PENTA.length];note(f,t,0.22,'square',0.035);note(f/2,t,0.22,'triangle',0.05);CHIP_I++;GTIMERS.push(setTimeout(chipStep,210))}
function startGen(){ctx();GEN_ON=true;if(MOOD==='lofi')lofiStep();else if(MOOD==='epico')epicoStep();else chipStep();PLAYING=true}
var tabs=document.querySelectorAll('[data-tab]');for(var ti=0;ti<tabs.length;ti++)(function(el){el.addEventListener('click',function(){for(var k=0;k<tabs.length;k++)tabs[k].classList.remove('on');el.classList.add('on');var w=el.getAttribute('data-tab');document.getElementById('tab-gen').style.display=w==='gen'?'':'none';document.getElementById('tab-mp3').style.display=w==='mp3'?'':'none';document.getElementById('tab-yt').style.display=w==='yt'?'':'none'})})(tabs[ti]);
var moods=document.querySelectorAll('[data-mood]');for(var mi=0;mi<moods.length;mi++)(function(el){el.addEventListener('click',function(){for(var k=0;k<moods.length;k++)moods[k].classList.remove('on');el.classList.add('on');MOOD=el.getAttribute('data-mood');var names={lofi:'Lo-fi generativo',epico:'Épico generativo',chip:'Chiptune generativo'};document.getElementById('tName').textContent=names[MOOD];if(PLAYING){stopAll();startGen()}})})(moods[mi]);
document.getElementById('bPlay').addEventListener('click',function(){if(PLAYING){stopAll();PLAYING=false;this.textContent='▶ Reproducir'}else{stopYT();startGen();this.textContent='⏸ Pausar'}});
document.getElementById('vol').addEventListener('input',function(e){if(GAIN)GAIN.gain.value=e.target.value/100});
function drawList(){var h='';PLAYLIST.forEach(function(t,i){h+='<div class="trk'+(i===IDX&&PLAYING?' on':'')+'" data-i="'+i+'"><span>'+(i+1)+'. '+t.n+'</span><span class="mut">'+(t.gen?'IA':(t.file?'local':'url'))+'</span></div>'});document.getElementById('plist').innerHTML=h;var ds=document.querySelectorAll('#plist .trk');for(var k=0;k<ds.length;k++)(function(el){el.addEventListener('click',function(){playIdx(parseInt(el.getAttribute('data-i')))})})(ds[k])}
function setMeta(){document.getElementById('mName').textContent=PLAYLIST[IDX].n}
function playIdx(i){IDX=(i+PLAYLIST.length)%PLAYLIST.length;stopAll();stopYT();var t=PLAYLIST[IDX];if(t.gen){startGen()}else{ctx();AUD=new Audio(t.url);AUD.crossOrigin='anonymous';try{SRCN=AC.createMediaElementSource(AUD);SRCN.connect(GAIN)}catch(e){}AUD.play();PLAYING=true}setMeta();drawList();document.getElementById('mPlay').textContent='⏸ Pausar'}
document.getElementById('mPlay').addEventListener('click',function(){if(PLAYING&&!PLAYLIST[IDX].gen){stopAll();PLAYING=false;this.textContent='▶ Reproducir';drawList()}else{stopYT();playIdx(IDX)}});
document.getElementById('mPrev').addEventListener('click',function(){playIdx(IDX-1)});
document.getElementById('mNext').addEventListener('click',function(){playIdx(IDX+1)});
document.getElementById('bAdd').addEventListener('click',function(){var u=document.getElementById('urlIn').value.trim();if(!u||u.indexOf('youtu')>=0){alert('Para YouTube usa la pestaña YouTube. Aquí solo MP3 directos.');return}PLAYLIST.push({n:u.split('/').pop().slice(0,40),url:u});document.getElementById('urlIn').value='';drawList()});
document.getElementById('fileIn').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;PLAYLIST.push({n:f.name.slice(0,40),url:URL.createObjectURL(f),file:true});drawList()});
function stopYT(){document.getElementById('ytBox').innerHTML=''}
function ytId(u){var m=u.match(/[?&]v=([^&#]+)/)||u.match(/youtu\.be\/([^?&#]+)/)||u.match(/\/embed\/([^?&#]+)/)||u.match(/\/shorts\/([^?&#]+)/);return m?m[1]:null}
document.getElementById('bYt').addEventListener('click',function(){var u=document.getElementById('ytIn').value.trim();var id=ytId(u);if(!id){alert('Pega un link válido de YouTube');return}stopAll();PLAYING=false;document.getElementById('bPlay').textContent='▶ Reproducir';document.getElementById('mPlay').textContent='▶ Reproducir';document.getElementById('ytBox').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>'});
var CV=document.getElementById('viz').getContext('2d');
(function viz(){requestAnimationFrame(viz);CV.clearRect(0,0,600,110);if(!AN||!PLAYING){CV.fillStyle='#26304d';CV.font='12px Segoe UI';CV.fillText('visualizador en pausa',230,60);return}var d=new Uint8Array(AN.frequencyBinCount);AN.getByteFrequencyData(d);var bw=600/d.length;for(var i=0;i<d.length;i++){var h=d[i]/255*100;var g=CV.createLinearGradient(0,110-h,0,110);g.addColorStop(0,'#e11d2e');g.addColorStop(1,'#2b7fff');CV.fillStyle=g;CV.fillRect(i*bw+1,110-h,bw-2,h)}})();
drawList();setMeta();
</script>
<script>(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}})},{threshold:.1});var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++){cs[i].classList.add('rv');cs[i].style.transitionDelay=(i%3)*.07+'s';io.observe(cs[i])}})();
</script></body>
</html>
