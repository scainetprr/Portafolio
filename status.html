<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Status en vivo · scainetprr</title>
<link rel="icon" type="image/png" href="Imagenes/favicon.png">
<style>
body{background:#060810;color:var(--w);font-family:Segoe UI,system-ui,Arial,sans-serif;padding:26px 18px;line-height:1.6;overflow-x:hidden}
:root{--bg:#060810;--card:#131a30;--line:#26304d;--red:#e11d2e;--blue:#2b7fff;--w:#eef1f8;--mut:#8b94ad;--grn:#3ddc84}
*{box-sizing:border-box;margin:0;padding:0}

.wrap{max-width:760px;margin:auto}
a{color:var(--blue)}
.back{font-size:14px}
h1{font-size:32px;margin:12px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
input[type=text]{flex:1;min-width:200px;padding:12px 16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-size:15px;outline:none}
.btn{padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#1c2440;color:#fff}
.btn.p{background:var(--red);border-color:var(--red)}
.btn.on{border-color:var(--red)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.on2{background:var(--grn);box-shadow:0 0 10px var(--grn)}
.off2{background:var(--red);box-shadow:0 0 10px var(--red)}
.srv{display:flex;gap:16px;align-items:center}
.srv img{width:64px;height:64px;border-radius:8px;background:#000}
.big{font-size:22px;font-weight:800}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:#0a0e1c;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--blue))}
.mono{font-family:Consolas,monospace;font-size:13px;color:#c0c8dc;white-space:pre-wrap}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
.card{transition:transform .3s,box-shadow .3s,border-color .3s}.card:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:0 10px 30px #e11d2e33}h1{text-shadow:0 0 30px #e11d2e44}.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s ease}.rv.vis{opacity:1;transform:none}#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.wrap{position:relative;z-index:1}.orb{position:fixed;border-radius:50%;filter:blur(110px);z-index:0;opacity:.12;pointer-events:none}.o1{width:350px;height:350px;background:#e11d2e;top:-160px;right:-120px;animation:drift 12s ease-in-out infinite alternate}.o2{width:320px;height:320px;background:#2b7fff;bottom:-160px;left:-120px;animation:drift 15s ease-in-out infinite alternate-reverse}@keyframes drift{to{transform:translate(-70px,60px) scale(1.15)}}.shead h2{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px #e11d2e44)}.card,.vcard,.exp,.statBig,.proj{box-shadow:0 12px 34px #00000088,inset 0 1px 0 #ffffff1f;border-color:#33406b}.wrap>h1{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px #e11d2e55)}.shead{border-bottom:1px solid #2b3a66}</style>
</head>
<body><canvas id="stars"></canvas><div class="orb o1"></div><div class="orb o2"></div>
<script>(function(){var cv=document.getElementById('stars');if(!cv)return;var cx=cv.getContext('2d'),P=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);for(var i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,s:Math.random()*.4+.12,c:['#ffffff','#e11d2e','#2b7fff'][i%3]});(function anim(){cx.clearRect(0,0,cv.width,cv.height);for(var k=0;k<P.length;k++){var p=P[k];p.y-=p.s;if(p.y<0){p.y=cv.height;p.x=Math.random()*cv.width}cx.globalAlpha=.65;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(anim)})();})();</script>

<div class="wrap">
<a class="back" href="index.html">← Volver al portafolio</a>
<h1>Status en vivo</h1>
<p class="sub">Estado real de servidores Minecraft Java y Bedrock: jugadores, versión y MOTD. Datos de api.mcsrvstat.us, se actualiza cada 60 s.</p>
<div class="card">
<div class="row">
<button class="btn" onclick="check('SKYLITH.LIVE','java')">SKYLITH.LIVE</button>
<button class="btn" onclick="check('mc.hyperhard.space','java')">mc.hyperhard.space</button>
</div>
<div class="row">
<input type="text" id="ip" placeholder="Otra IP (ej: play.ejemplo.com:25565)">
<button class="btn" id="bJava" onclick="setType('java')">Java</button>
<button class="btn" id="bBed" onclick="setType('bedrock')">Bedrock</button>
<button class="btn p" onclick="checkCustom()">Consultar</button>
</div>
</div>
<div class="card" id="out"><p class="mut">Elige un servidor o escribe una IP.</p></div>
<footer>scainetprr · Status en vivo</footer>
</div>
<script>
var TYPE='java', TIMER=null, LASTIP='';
function setType(t){TYPE=t;document.getElementById('bJava').classList.toggle('on',t==='java');document.getElementById('bBed').classList.toggle('on',t==='bedrock')}
setType('java');
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML}
function check(ip,type){document.getElementById('ip').value=ip;setType(type||'java');fetchStatus()}
function checkCustom(){var ip=document.getElementById('ip').value.trim();if(!ip)return;fetchStatus()}
async function fetchStatus(){
var ip=document.getElementById('ip').value.trim();if(!ip)return;LASTIP=ip;
var box=document.getElementById('out');box.innerHTML='<p class="mut">Consultando '+esc(ip)+' ...</p>';
try{
var base=TYPE==='bedrock'?'https://api.mcsrvstat.us/bedrock/3/':'https://api.mcsrvstat.us/3/';
var r=await fetch(base+encodeURIComponent(ip));var d=await r.json();
if(!d.online){box.innerHTML='<p><span class="dot off2"></span><b>'+esc(ip)+'</b> está <b style="color:var(--red)">OFFLINE</b></p><p class="mut">Sin respuesta del servidor.</p>';return}
var pct=d.players&&d.players.max?Math.round(100*d.players.online/d.players.max):0;
var motd=(d.motd&&d.motd.html)?d.motd.html.join('<br>'):((d.motd&&d.motd.clean)?d.motd.clean.join('<br>'):'—');
box.innerHTML='<div class="srv">'+(d.icon?'<img src="'+d.icon+'" alt="icon">':'')+'<div><p><span class="dot on2"></span><b class="big">'+esc(ip)+'</b> <b style="color:var(--grn)">ONLINE</b></p><p class="mut">Versión: '+esc(d.version||'?')+' · '+(d.players?d.players.online+'/'+d.players.max+' jugadores':'')+'</p></div></div><div class="bar"><i style="width:'+pct+'%"></i></div><p class="mut" style="margin-top:10px">MOTD:</p><p class="mono">'+motd+'</p>';
}catch(e){box.innerHTML='<p style="color:var(--red)">Error consultando el servidor. Revisa la IP e intenta de nuevo.</p>'}
if(TIMER)clearInterval(TIMER);TIMER=setInterval(function(){if(document.getElementById('ip').value.trim()===LASTIP)fetchStatus()},60000);
}
</script>
<script>(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}})},{threshold:.1});var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++){cs[i].classList.add('rv');cs[i].style.transitionDelay=(i%3)*.07+'s';io.observe(cs[i])}})();
</script></body>
</html>
