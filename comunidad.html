<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--bg:#0a0e1a;--card:#131a30;--line:#26304d;--red:#e11d2e;--blue:#2b7fff;--w:#eef1f8;--mut:#8b94ad;--grn:#3ddc84}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 400px at 15% 0%,#2b7fff22,transparent 60%),radial-gradient(900px 400px at 85% 0%,#e11d2e22,transparent 60%),var(--bg);color:var(--w);font-family:Segoe UI,system-ui,Arial,sans-serif;padding:26px 18px;line-height:1.6}
.wrap{max-width:820px;margin:auto}
a{color:var(--blue)}
.back{font-size:14px}
h1{font-size:32px;margin:12px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.live{border:1px solid var(--line);border-radius:12px;padding:16px;background:#0d1428}
.live h4{font-size:15px;margin-bottom:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.on2{background:var(--grn);box-shadow:0 0 10px var(--grn)}
.off2{background:var(--mut)}
label{color:var(--mut);font-size:12px;display:block;margin:10px 0 5px}
input[type=text]{width:100%;padding:11px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-size:14px;outline:none;box-sizing:border-box}
.btn{padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#1c2440;color:#fff;margin-top:10px}
.btn.p{background:var(--red);border-color:var(--red)}
.btn.g{background:var(--grn);border-color:var(--grn);color:#06130c}
ol.guide{margin:8px 0 8px 20px;color:#c0c8dc;font-size:14px}
ol.guide li{margin:5px 0}
ol.guide code{font-family:Consolas,monospace;background:#0a0e1c;padding:2px 8px;border-radius:6px;font-size:12px}
.chat{background:#0a0e1c;border:1px solid var(--line);border-radius:10px;padding:14px;height:220px;overflow-y:auto;margin:10px 0}
.msg{margin:8px 0;max-width:90%;padding:8px 12px;border-radius:10px;font-size:14px}
.me{margin-left:auto;background:#1c2440}
.ai{background:#131a30;border:1px solid var(--line)}
.qrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qrow button{background:#161d33;color:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:12px}
.pk{display:flex;gap:14px;align-items:center;margin-top:10px}
.pk img{image-rendering:pixelated;border-radius:8px}
.mut{color:var(--mut);font-size:13px}
.proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.proj a{display:block;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:#fff;font-size:13px;font-weight:700;background:#161d33}
.proj a:hover{border-color:var(--red)}
.proj small{display:block;color:var(--mut);font-weight:400;font-size:11px}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
body{background:radial-gradient(900px 400px at 15% 0%,#2b7fff22,transparent 60%),radial-gradient(900px 400px at 85% 0%,#e11d2e22,transparent 60%),var(--bg)}.card{transition:transform .3s,box-shadow .3s,border-color .3s}.card:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:0 10px 30px #e11d2e33}h1{text-shadow:0 0 30px #e11d2e44}.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s ease}.rv.vis{opacity:1;transform:none}#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.wrap{position:relative;z-index:1}.orb{position:fixed;border-radius:50%;filter:blur(110px);z-index:0;opacity:.32;pointer-events:none}.o1{width:480px;height:480px;background:#e11d2e;top:-160px;right:-120px;animation:drift 14s ease-in-out infinite alternate}.o2{width:420px;height:420px;background:#2b7fff;bottom:-160px;left:-120px;animation:drift 18s ease-in-out infinite alternate-reverse}@keyframes drift{to{transform:translate(-70px,60px) scale(1.15)}}.shead h2{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px #e11d2e44)}.card,.vcard,.exp,.statBig,.proj{box-shadow:0 12px 34px #00000088,inset 0 1px 0 #ffffff1f;border-color:#33406b}.wrap>h1{background:linear-gradient(90deg,#ffffff,#ffc9d1 70%,#e11d2e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px #e11d2e55)}.shead{border-bottom:1px solid #2b3a66}</style>
</head>

<script>(function(){var cv=document.getElementById('stars');if(!cv)return;var cx=cv.getContext('2d'),P=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);for(var i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,s:Math.random()*.4+.12,c:['#ffffff','#e11d2e','#2b7fff'][i%3]});(function anim(){cx.clearRect(0,0,cv.width,cv.height);for(var k=0;k<P.length;k++){var p=P[k];p.y-=p.s;if(p.y<0){p.y=cv.height;p.x=Math.random()*cv.width}cx.globalAlpha=.65;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(anim)})();})();

<div class="wrap">

<h1>Centro de comunidad</h1>
<p class="sub">Une tu Discord con tu Minecraft: estado en vivo, guías, asistente y buscador.</p>
<div class="card"><h3>Mi comunidad en vivo</h3><div class="grid2">
<div class="live" id="liveD"><h4>💬 Discord</h4><p class="mut">Sin conectar.</p></div>
<div class="live" id="liveM"><h3 style="font-size:15px">⛏️ Minecraft</h3><p class="mut">Sin conectar.</p></div>
</div><button class="btn" id="bRefresh">Actualizar 🔄</button></div>
<div class="card"><h3>1 · Conecta tu Discord</h3>
<div style="margin-bottom:6px"><button class="btn" data-preset="1536465811223617587|https://discord.gg/qyyREajJgC">Skylith</button> <button class="btn" data-preset="1522475608263622676|https://discord.gg/dkZpFtXXCj">Hydra</button></div><label>ID del servidor</label><input type="text" id="dId" placeholder="Ej: 123456789012345678">
<label>Link de invitación</label><input type="text" id="dInv" placeholder="Ej: https://discord.gg/abc123">
<button class="btn p" id="bDiscord">Verificar y guardar ✅</button>
<ol class="guide"><li>En Discord: <b>Ajustes del servidor → Widget</b>.</li><li>Activa el widget y elige un canal de invitación.</li><li>Copia el <b>Server ID</b> (clic derecho al nombre → Copiar ID, con modo desarrollador).</li></ol></div>
<div class="card"><h3>2 · Conecta tu Minecraft</h3>
<label>IP del servidor</label><input type="text" id="mIp" placeholder="Ej: SKYLITH.LIVE">
<button class="btn p" id="bMc">Probar y guardar ✅</button>
<p class="mut">Java y Bedrock (marca Bedrock si aplica): <input type="checkbox" id="mBed" style="width:auto"> Bedrock</p></div>
<div class="card"><h3>3 · Asistente de conexión</h3>
<div class="chat" id="aChat"></div>
<div class="qrow"><button data-aq="widget">Activar widget</button><button data-aq="ip">Encontrar mi IP</button><button data-aq="revisar">Revisar mi configuración</button></div>
<div style="display:flex;gap:8px"><input type="text" id="aIn" placeholder="Pregunta algo..." maxlength="200"><button class="btn p" id="bAsk">Enviar</button></div></div>
<div class="card"><h3>4 · Buscador de jugadores</h3>
<input type="text" id="pNick" placeholder="Nick de Minecraft...">
<button class="btn p" id="bPk">Buscar</button>
<div class="pk" id="pkOut"></div></div>

</div></div>

<script>
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML}
async function discordWidget(id){var r=await fetch('https://discord.com/api/guilds/'+encodeURIComponent(id)+'/widget.json');if(!r.ok)throw new Error('widget');return r.json()}
async function mcStatus(ip,bed){var base=bed?'https://api.mcsrvstat.us/bedrock/3/':'https://api.mcsrvstat.us/3/';var r=await fetch(base+encodeURIComponent(ip));return r.json()}
async function inviteGuild(code){var r=await fetch('https://discord.com/api/v10/invites/'+encodeURIComponent(code)+'?with_counts=true');if(!r.ok)throw 0;return r.json()}
async function refreshLive(){
var d=store('com_discord'),m=store('com_mc');
var ld=document.getElementById('liveD'),lm=document.getElementById('liveM');
if(d&&d.id){try{var w=await discordWidget(d.id);ld.innerHTML='<h4>💬 '+esc(w.name||'Discord')+'</h4><p><span class="dot on2"></span><b>'+w.presence_count+'</b> en línea</p><p class="mut">Canal: '+esc(d.inv||'')+'</p>'}catch(e){ld.innerHTML='<h4>💬 Discord</h4><p><span class="dot off2"></span><span class="mut">Widget desactivado en el servidor. Actívalo en Ajustes → Widget.</span></p>'}}else{ld.innerHTML='<h4>💬 Discord</h4><p class="mut">Sin conectar.</p>'}
if(m&&m.ip){try{var s=await mcStatus(m.ip,m.bed);if(s.online){lm.innerHTML='<h4>⛏️ '+esc(m.ip)+'</h4><p><span class="dot on2"></span><b>'+s.players.online+'/'+s.players.max+'</b> · '+esc(s.version||'')+'</p>'}else{lm.innerHTML='<h4>⛏️ '+esc(m.ip)+'</h4><p><span class="dot off2"></span>Offline</p>'}}catch(e){lm.innerHTML='<h4>⛏️ Minecraft</h4><p class="mut">Sin respuesta.</p>'}}else{lm.innerHTML='<h4>⛏️ Minecraft</h4><p class="mut">Sin conectar.</p>'}
}
document.getElementById('bRefresh').addEventListener('click',refreshLive);
var prs=document.querySelectorAll('[data-preset]');for(var pi=0;pi<prs.length;pi++)(function(el){el.addEventListener('click',function(){var p=el.getAttribute('data-preset').split('|');document.getElementById('dId').value=p[0];document.getElementById('dInv').value=p[1]})})(prs[pi]);document.getElementById('bDiscord').addEventListener('click',async function(){var id=document.getElementById('dId').value.trim(),inv=document.getElementById('dInv').value.trim();if(!id){alert('Pega el Server ID');return}try{await discordWidget(id);store('com_discord',{id:id,inv:inv});refreshLive();alert('Discord verificado y guardado')}catch(e){alert('No responde: activa el Widget del servidor primero')}});
document.getElementById('bMc').addEventListener('click',async function(){var ip=document.getElementById('mIp').value.trim();if(!ip)return;var bed=document.getElementById('mBed').checked;try{var s=await mcStatus(ip,bed);if(!s.online){alert('El servidor no responde')}else{store('com_mc',{ip:ip,bed:bed});refreshLive();alert('Minecraft guardado: '+s.players.online+' online')}}catch(e){alert('Error consultando')}});
function abubble(who,h){var c=document.getElementById('aChat');var d=document.createElement('div');d.className='msg '+who;d.innerHTML=h;c.appendChild(d);c.scrollTop=99999}
function aask(q){abubble('me',esc(q));var a=q.toLowerCase(),r='Puedo guiarte con el <b>widget</b>, tu <b>IP</b> o <b>revisar</b> tu configuración. Usa los botones.';if(a.indexOf('widget')>=0)r='Activa el widget en <b>Ajustes del servidor → Widget</b>, elige canal de invitación y pega el Server ID arriba.';else if(a.indexOf('ip')>=0)r='Tu IP es la que pones en el launcher. Si usas puerto no estándar, escríbela como <b>ip:puerto</b>. Para Bedrock marca la casilla.';else if(a.indexOf('revis')>=0)r='Pulsa <b>Actualizar</b> arriba: si Discord dice widget desactivado o Minecraft dice offline, revisa esos pasos.';setTimeout(function(){abubble('ai',r)},400)}
document.getElementById('bAsk').addEventListener('click',function(){var i=document.getElementById('aIn');if(i.value.trim()){aask(i.value.trim());i.value=''}});
document.getElementById('aIn').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('bAsk').click()});
var qs=document.querySelectorAll('[data-aq]');for(var i=0;i<qs.length;i++)(function(el){el.addEventListener('click',function(){aask(el.textContent)})})(qs[i]);
abubble('ai','¡Hola! Soy tu asistente. Puedo guiarte para activar el widget, conseguir IDs e IPs, o revisar si todo responde.');
document.getElementById('bPk').addEventListener('click',async function(){var u=document.getElementById('pNick').value.trim();var box=document.getElementById('pkOut');if(!u)return;box.innerHTML='<span class="mut">Buscando...</span>';try{var r=await fetch('https://api.mojang.com/users/profiles/minecraft/'+encodeURIComponent(u));if(!r.ok)throw 0;var j=await r.json();var h=await (await fetch('https://api.mojang.com/user/profiles/'+j.id+'/names')).json();var names=h.map(function(x){return x.name}).join(', ');box.innerHTML='<img src="https://minotar.net/helm/'+j.id+'/80.png" width="80" height="80" alt="skin"><div><b>'+esc(j.name)+'</b><br><span class="mut" style="font-size:11px">UUID: '+j.id+'</span><br><span class="mut" style="font-size:12px">Historial: '+esc(names)+'</span></div>'}catch(e){box.innerHTML='<span class="mut">Jugador no encontrado (solo Java premium).</span>'}});
(function(){var d=store('com_discord');if(d){if(d.id)document.getElementById('dId').value=d.id;if(d.inv)document.getElementById('dInv').value=d.inv}var m=store('com_mc');if(m){if(m.ip)document.getElementById('mIp').value=m.ip;document.getElementById('mBed').checked=!!m.bed}refreshLive()})();
</script>
<script>(function(){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}})},{threshold:.1});var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++){cs[i].classList.add('rv');cs[i].style.transitionDelay=(i%3)*.07+'s';io.observe(cs[i])}})();
</script></body>
